name: Contract Tests

# 跨層契約測試。刻意設計成「純函式、不需要外部服務」，所以不需要任何 secret、
# 資料庫或 API key，可以在每次 push / PR 上直接跑。
#
# 這些測試存在的理由：Cloud → Fog → App 之間的資料契約過去只以描述性型別檔存在，
# 沒有任何機制會在它被違反時報錯，已導致多次靜默失效（族群標籤中英文對不上、
# nutrition_facts 位置被誤解等）。有了這個 workflow，改壞契約會當場擋下。

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  python-contract:
    name: Cloud 回應契約 / 族群詞彙
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 大部分契約測試只 import server/module_a 與 server/module_d，兩者在模組層
      # 都只依賴標準函式庫，不需要安裝 requirements.txt。
      #
      # 額外的 fastapi / requests / python-dotenv / httpx 只為了 test_health_endpoints.py
      # ——它需要實際載入 fog/main.py 才能驗證 /health 的行為。不裝的話那些測試會被
      # importorskip 靜默跳過，而「被跳過的測試」等於沒有強制力，比沒寫更危險（看起來是綠的）。
      # sqlalchemy / psycopg2-binary 為 test_safety_engine_contract.py 所需：
      # server/database.py 在 import 時就建立 engine，故即使測試跑在記憶體 SQLite 上，
      # 仍必須有 PostgreSQL 驅動才能載入 models。
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest fastapi requests python-dotenv httpx \
                                sqlalchemy psycopg2-binary

      # 明確要求最低測試數，避免哪天收集不到測試卻回傳成功（例如 .gitignore 又把
      # 測試檔擋掉、或 importorskip 靜默跳過整個檔案）而「假綠」。
      # 同時擋下「有測試被跳過」——跳過的測試不具強制力，而畫面仍是綠的，
      # 比沒寫測試更危險。依賴沒裝齊時 importorskip 就會靜默跳過整個檔案。
      - name: Run contract tests
        run: |
          set -o pipefail
          pytest --tb=short | tee /tmp/pytest.out
          if grep -qE '[0-9]+ skipped' /tmp/pytest.out; then
            echo "::error::有測試被跳過，請確認測試依賴是否安裝完整"
            exit 1
          fi

  app-tests:
    name: App 個人化邏輯
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: APP
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 專案未提交 package-lock.json（APP/.gitignore 未忽略它，但從未加入版控），
      # 因此不能用 npm ci。
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run tests
        run: npm test -- --ci
