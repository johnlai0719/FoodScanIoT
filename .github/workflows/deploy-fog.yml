# 部署 Fog 至 Raspberry Pi 5。2026-08-05 重新啟用（先前因 PI_TAILSCALE_IP 過期而停用）。
#
# 觸發條件為 push 到 main 且改動含 fog/**，或手動 workflow_dispatch。
#
# 需要的 secret：TAILSCALE_AUTHKEY / PI_TAILSCALE_IP / FOG_SSH_PRIVATE_KEY
# Pi 端需要：repo 位於 /home/johnlai/fog/FoodScanIoT、fog/venv、
#           systemd 服務 fog-python 與 fog-node、sudoers 對 systemctl restart 免密碼。
#
# 重新啟用時一併修正的問題（原腳本會在下列三處失敗或失效）：
#   1. npm install --production 跳過 devDependencies，但次行的 npm run build 需要
#      其中的 typescript。原本能過是因 node_modules 殘留舊安裝，Pi 重灌即失敗。
#   2. git pull 遇到髒的工作區會拒絕。改為 fetch + reset --hard，Pi 是部署目標
#      而非開發環境，本機修改一律視為意外。
#   3. 健康檢查只確認端點有回應，服務若沒真的重啟、仍跑舊程式碼也會通過——那正是
#      2026-08-05 前的實際狀態（六月的版本一路活著）。改為比對 /health 回報的
#      commit 是否等於本次部署的 SHA。
name: Deploy Fog to Pi 5

on:
  push:
    branches: [main]
    paths:
      - 'fog/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Wait for Tailscale
        run: sleep 10

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PI_TAILSCALE_IP }}
          username: johnlai
          key: ${{ secrets.FOG_SSH_PRIVATE_KEY }}
          envs: GITHUB_SHA
          script: |
            set -e
            cd /home/johnlai/fog/FoodScanIoT

            # Pi 是部署目標，不是開發環境——本機修改一律捨棄，否則 git pull 會失敗
            git fetch origin main
            git reset --hard origin/main
            git clean -fd fog

            cd fog
            source venv/bin/activate
            pip install -r requirements.txt

            # 不可用 --production：typescript 在 devDependencies，下一行的 build 需要它
            npm ci || npm install
            npm run build

            # 兩層都會以 git rev-parse 取得 commit，而上面的 reset --hard 已讓
            # HEAD 等於本次部署的版本，故不需注入環境變數。
            # （刻意不用 `sudo systemctl set-environment`：那是另一道 sudo 指令，
            #   若未列入 NOPASSWD 會讓非互動式部署卡在密碼提示。）
            sudo systemctl restart fog-python fog-node
            sleep 5

            # 驗證：服務活著，且跑的確實是本次部署的版本
            for port in 3001 3002; do
              body=$(curl -sf "http://localhost:$port/health") || {
                echo "健康檢查失敗：port $port 沒有回應"; exit 1; }
              echo "port $port -> $body"
              echo "$body" | grep -q "\"commit\":\"${GITHUB_SHA:0:7}\"" || {
                echo "版本不符：port $port 回報的 commit 不是本次部署的 ${GITHUB_SHA:0:7}"
                echo "服務可能沒有真的重啟，或載入了舊的程式碼"
                exit 1; }
            done

            echo "Deploy success — ${GITHUB_SHA:0:7}"
