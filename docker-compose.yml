services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: 'product_db'
      POSTGRES_USER: 'postgres'
      POSTGRES_PASSWORD: 'password'
    ports:
      - '5432:5432'
    volumes:
      - ./postgres_data:/var/lib/postgresql/data

  cloud-server:
    build:
      context: ./server
    env_file:
      - ./server/.env
    ports:
      - '8000:8000'
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:password@db:5432/product_db
    depends_on:
      - db
