services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: 'product_db'
      POSTGRES_USER: 'postgres'
      POSTGRES_PASSWORD: 'password'
    ports:
      - '5432:5432'
    volumes:
      - ./postgres_data:/var/lib/postgresql/data

  cloud-server:
    build:
      context: ./cloud
    env_file:
      - ./cloud/.env
    ports:
      # 對外 3003、容器內 8000。**不要改成 8000:8000。**
      # 2026-09-13：專案對外一直是 3003（防火牆規則 "Cloud Fog Port 3003"、
      # App 的常數、Fog 的 CLOUD_API_URL 都是），只有 compose 是 8000，
      # 於是 Pi 打不進來、每次都降階。統一成對外 3003 之後就沒有「兩套埠號」
      # 這件事了——容器內部用什麼與外面無關。
      - '3003:8000'
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:password@db:5432/product_db
      # ⚠ 這兩行不可省。`cloud/.env` 裡 DB_HOST=localhost 是給本機直跑用的，
      # 但 main.py:571 與 admin_api.py 走 psycopg2 直連、只讀 DB_HOST，
      # 在容器內 localhost 會指向容器自己 → 比對添加物時連不上資料庫。
      # compose 的 environment 優先於 env_file，在此覆蓋。
      - DB_HOST=db
      - DB_PORT=5432
      # 同理，帳密也要覆蓋成 db service 實際初始化的那組（見上方 POSTGRES_*），
      # 否則 .env 裡給本機用的密碼會讓容器內認證失敗。
      - DB_NAME=product_db
      - DB_USER=postgres
      - DB_PASSWORD=password
    volumes:
      # 上傳的標示照片。**沒有這一行，圖片只活到下一次 --build 為止。**
      # 2026-09-21 進容器看過：服務跑了四天，uploads/ 裡只剩 3 個檔——
      # 不是沒人上傳，是每次重建都從頭開始。scan_uploads 表存的 stored_path
      # 指向這裡，檔案沒了紀錄就變成一堆指不到東西的路徑。
      #
      # 用 bind mount 而不是 named volume：這批圖的用途就是要被拿去看、拿去
      # 收進測試集，放在主機上看得到的路徑才方便；容量也才一眼看得出來。
      - ./uploads:/app/uploads
    depends_on:
      - db
