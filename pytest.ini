[pytest]
# 預設只跑契約測試——它們是純函式，不需要資料庫、伺服器或 API key，
# 因此可以在 CI 上直接執行（見 .github/workflows/contract.yml）。
#
# cloud/tests/ 底下另有四支整合測試（test_admin_auth / test_admin_review /
# test_public_actions / test_database_init），它們需要「跑起來的伺服器 + 已初始化
# 且含 ADD-0001 的 PostgreSQL」，而且會實際寫入資料庫。刻意不納入預設路徑，
# 避免在沒有環境時集體失敗、或誤改到正式資料。要跑那些請明確指定：
#     pytest cloud/tests/test_admin_auth.py
testpaths = cloud/tests/contract
python_files = test_*.py
addopts = -q
