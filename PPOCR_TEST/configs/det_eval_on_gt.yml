# 只用來評估：拿 FoodScanData/eval_det_gt 的人工標註，量 det 的 precision/recall/hmean。
#
# 為什麼要獨立一個檔而不是用 -o 覆寫：`Eval.dataset.transforms` 是 list，
# 用 -o 指定 list 裡第幾項的巢狀鍵不穩定，直接寫成設定檔比較清楚。
#
# **關鍵是 DetResizeForTest 的縮放要與推論一致。**
# 它的預設是 limit_side_len=736 / limit_type='min'——對 4284x5712 的照片
# 那代表「短邊不足 736 才放大」，等於幾乎不縮，只被 max_side_limit=4000 擋住，
# 結果在 3000x4000 上評估。那既慢又量不到實際表現，因為 run_baseline 的
# v6_best 是用 2048 / max。這裡明確設成一致的值。
#
# 用法（在 PaddleOCR repo 根目錄）：
#   python tools/eval.py -c ../PPOCR_TEST/configs/det_eval_on_gt.yml \
#     -o Global.pretrained_model=../PPOCR_TEST/pretrain/PP-OCRv6_medium_det_pretrained
#   換 pretrained_model 就能比較不同模型。

Global:
  model_name: PP-OCRv6_medium_det
  use_gpu: true
  epoch_num: 1
  save_model_dir: ../PPOCR_TEST/output/_det_eval_tmp
  pretrained_model: ../PPOCR_TEST/pretrain/PP-OCRv6_medium_det_pretrained
  checkpoints: null
  distributed: false
  print_batch_step: 5

Architecture:
  model_type: det
  algorithm: DB
  Transform: null
  Backbone:
    name: PPLCNetV4
    det: true
    model_size: medium
  Neck:
    name: RepLKPAN
    out_channels: 256
    intracl: true
  Head:
    name: DBHead
    k: 50
    fix_nan: true
    aux_in_channels: 256

Loss:
  name: DBLoss
  main_loss_type: DiceFocalLoss
  alpha: 5
  beta: 10
  focal_alpha: 0.25
  focal_gamma: 2.5
  aux_weight_p4: 0.2
  aux_weight_p3: 0.3
  aux_weight_p2: 0.4

Optimizer:
  name: Adam
  beta1: 0.9
  beta2: 0.999
  lr:
    name: Cosine
    learning_rate: 0.00001
  regularizer:
    name: L2
    factor: 1.0e-05

PostProcess:
  name: DBPostProcess
  thresh: 0.2
  box_thresh: 0.4          # 與 v6_best 推論設定一致
  max_candidates: 3000
  unclip_ratio: 1.4

Metric:
  name: DetMetric
  main_indicator: hmean

Train:      # eval.py 仍要求這一段存在，指向同一份資料即可，不會被使用
  dataset:
    name: SimpleDataSet
    data_dir: ../FoodScanData/eval_det_gt
    label_file_list: [../FoodScanData/eval_det_gt/val_list.txt]
    transforms:
    - DecodeImage: {img_mode: BGR, channel_first: false}
    - DetLabelEncode: null
    - DetResizeForTest: {limit_side_len: 2048, limit_type: max}
    - NormalizeImage:
        scale: 1./255.
        mean: [0.485, 0.456, 0.406]
        std: [0.229, 0.224, 0.225]
        order: hwc
    - ToCHWImage: null
    - KeepKeys: {keep_keys: [image, shape, polys, ignore_tags]}
  loader:
    shuffle: false
    drop_last: false
    batch_size_per_card: 1
    num_workers: 0

Eval:
  dataset:
    name: SimpleDataSet
    data_dir: ../FoodScanData/eval_det_gt
    label_file_list: [../FoodScanData/eval_det_gt/val_list.txt]
    transforms:
    - DecodeImage: {img_mode: BGR, channel_first: false}
    - DetLabelEncode: null
    # 對齊 run_baseline.py 的 v6_best：長邊 2048
    - DetResizeForTest: {limit_side_len: 2048, limit_type: max}
    - NormalizeImage:
        scale: 1./255.
        mean: [0.485, 0.456, 0.406]
        std: [0.229, 0.224, 0.225]
        order: hwc
    - ToCHWImage: null
    - KeepKeys: {keep_keys: [image, shape, polys, ignore_tags]}
  loader:
    shuffle: false
    drop_last: false
    batch_size_per_card: 1
    num_workers: 0
profiler_options: null
