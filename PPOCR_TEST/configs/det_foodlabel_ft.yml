# PP-OCRv6_medium_det 在食品包裝標註上的 fine-tune 設定。
#
# 由 PaddleOCR/configs/det/PP-OCRv6/PP-OCRv6_medium_det.yml 改來。
# **這一輪是可行性測試,不是要產出可用模型**——只有 7 張訓練圖。
#
# 訓練圖用的是 ../FoodScanData/train_det_2048（原圖縮到長邊 2048、座標同步縮放），
# **不是原始的 4284x5712**。理由是尺度必須與推論一致：
# 推論時 text_det_limit_side_len=2048 會把整張縮到 0.36 倍才進 det，
# 而訓練若用 RandomCrop 從原解析度裁 640x640，模型看到的字會比推論時大 2.8 倍。
# 那樣就算 loss 降下來，套回實際推論也對不上。順帶讓每張從 24MP 變 3MP，
# 解碼快約 7 倍（原本 avg_reader_cost 4.16s）。
# 目的：看模型「學不學得到」使用者標的那種框（直排整條、刪掉碎框）。
#
# 判讀方式：
#   訓練 loss 明顯下降、且在 7 張訓練圖上能重現標註 → 表示法可學，值得加碼標註
#   連訓練圖都學不會                                 → 表示法有問題，別再標了
# 2 張驗證圖的 hmean 參考價值有限（樣本太少），但退步得很誇張仍值得注意。
#
# 執行（在 PaddleOCR repo 根目錄）：
#   cd D:/FoodScanIot/PaddleOCR
#   python tools/train.py -c ../PPOCR_TEST/configs/det_foodlabel_ft.yml

Global:
  model_name: PP-OCRv6_medium_det
  debug: false
  use_gpu: true
  # EMA 在小資料上會讓權重更新被平滑掉，看不出有沒有在學。關掉。
  use_ema: false
  epoch_num: &epoch_num 60
  log_smooth_window: 10
  print_batch_step: 5
  save_model_dir: ../PPOCR_TEST/output/det_foodlabel_ft
  save_epoch_step: 25
  eval_batch_step: [0, 50]
  cal_metric_during_train: false
  checkpoints: null
  pretrained_model: ../PPOCR_TEST/pretrain/PP-OCRv6_medium_det_pretrained
  save_inference_dir: null
  use_visualdl: false
  infer_img: doc/imgs_en/img_10.jpg
  save_res_path: ../PPOCR_TEST/output/det_foodlabel_ft/predicts.txt
  d2s_train_image_shape: [3, 640, 640]
  distributed: false

Architecture:
  model_type: det
  algorithm: DB
  Transform: null
  Backbone:
    name: PPLCNetV4
    det: true
    model_size: medium
  Neck:
    name: RepLKPAN
    out_channels: 256
    intracl: true
  Head:
    name: DBHead
    k: 50
    fix_nan: true
    aux_in_channels: 256

Loss:
  name: DBLoss
  main_loss_type: DiceFocalLoss
  alpha: 5
  beta: 10
  focal_alpha: 0.25
  focal_gamma: 2.5
  aux_weight_p4: 0.2
  aux_weight_p3: 0.3
  aux_weight_p2: 0.4

Optimizer:
  name: Adam
  beta1: 0.9
  beta2: 0.999
  lr:
    name: Cosine
    # 原檔 1e-3 是 8 卡從頭訓練的設定。單卡 fine-tune 而且只有 7 張圖，
    # 用原值會直接把預訓練權重沖爛。取 1/20。
    learning_rate: 0.00005
    warmup_epoch: 5
  regularizer:
    name: L2
    factor: 1.0e-05

PostProcess:
  name: DBPostProcess
  thresh: 0.2
  # 與 v6_best 推論設定一致（0.4），這樣訓練後的評估與 run_baseline 可比
  box_thresh: 0.4
  max_candidates: 3000
  unclip_ratio: 1.4

Metric:
  name: DetMetric
  main_indicator: hmean

Train:
  dataset:
    name: SimpleDataSet
    data_dir: ../FoodScanData/train_det_2048
    label_file_list:
      - ../FoodScanData/train_det_2048/train_list.txt
    ratio_list: [1.0]
    transforms:
    - DecodeImage:
        img_mode: BGR
        channel_first: false
    - DetLabelEncode: null
    # CopyPaste 需要多張圖互相貼合，7 張時樣本太相似反而製造假象。關掉。
    - ColorJitter:
        brightness: 0.4
        contrast: 0.4
        saturation: 0.7
        hue: 0.1
    - IaaAugment:
        augmenter_args:
        # **Fliplr 拿掉**：原檔會左右翻轉，但中文字翻轉後不成字，
        # 對「學會辨識中文排版」是反效果。場景文字資料集可以這樣做，
        # 密集中文標示不行。
        - type: Affine
          args:
            p: 0.5
            rotate: [-15, 15]      # 原檔 ±45 度；手持拍攝不會歪那麼多
            fit_output: true
        - type: Resize
          args:
            size: [0.5, 2]
    - RandomPerspective:
        prob: 0.3
        scale: 0.0
        shear: 20.0
        perspective: 0.001
        fit_output: true
        fill_value: [0, 0, 0]
    - RandomCrop:
        size: [640, 640]
        max_tries: 50
        keep_ratio: true
    - MakeBorderMap:
        shrink_ratio: 0.4
        thresh_min: 0.3
        thresh_max: 0.7
        total_epoch: *epoch_num
    - MakeShrinkMap:
        shrink_ratio: 0.4
        # 原檔 8：小於 8px 的文字直接當忽略。你的直排欄寬在 640 裁切後
        # 常常只有 10-20px，門檻留著沒問題，但值得記住它存在。
        min_text_size: 8
        total_epoch: *epoch_num
    - NormalizeImage:
        scale: 1./255.
        mean: [0.485, 0.456, 0.406]
        std: [0.229, 0.224, 0.225]
        order: hwc
    - ToCHWImage: null
    - KeepKeys:
        keep_keys: [image, threshold_map, threshold_mask, shrink_map, shrink_mask]
  loader:
    shuffle: true
    drop_last: false
    # 原檔 8。7 張圖時 batch 開太大等於每個 step 都看到全部資料，
    # 梯度雜訊不足。4 讓它一個 epoch 有兩步。
    batch_size_per_card: 4
    # Windows 的 dataloader 走 spawn，開太多會卡住
    num_workers: 2

Eval:
  dataset:
    name: SimpleDataSet
    data_dir: ../FoodScanData/train_det_2048
    label_file_list:
      - ../FoodScanData/train_det_2048/val_list.txt
    transforms:
    - DecodeImage:
        img_mode: BGR
        channel_first: false
    - DetLabelEncode: null
    - DetResizeForTest: null
    - NormalizeImage:
        scale: 1./255.
        mean: [0.485, 0.456, 0.406]
        std: [0.229, 0.224, 0.225]
        order: hwc
    - ToCHWImage: null
    - KeepKeys:
        keep_keys: [image, shape, polys, ignore_tags]
  loader:
    shuffle: false
    drop_last: false
    batch_size_per_card: 1
    num_workers: 2
profiler_options: null
