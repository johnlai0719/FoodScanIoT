version: '3.8'

services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: 'product_db'
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-password}
    ports:
      - '3306:3306'
    volumes:
      - ../mysql_data:/var/lib/mysql

  web:
    build: .
    ports:
      - '8000:8000'
    environment:
      - DATABASE_URL=mysql+pymysql://root:${MYSQL_ROOT_PASSWORD:-password}@db:3306/product_db
    depends_on:
      - db

volumes:
  db_data:
